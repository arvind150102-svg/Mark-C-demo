name: Synthetic example tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Runtime and unit tests
        run: |
          python3 --version
          python3 -m unittest discover -s tests -v
      - name: Reproduce committed fixtures
        run: |
          python3 pricing.py > /tmp/pricing-result.json
          diff -u examples/expected.json /tmp/pricing-result.json
          python3 sensitivity.py > /tmp/sensitivity-result.json
          diff -u examples/sensitivity_expected.json /tmp/sensitivity-result.json
